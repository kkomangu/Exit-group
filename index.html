<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>품목별 계산기</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px 0;
        }
        .calculator {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 520px;
        }
        h2 {
            text-align: center;
            margin-top: 0;
            color: #333;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
            margin-top: 20px;
            margin-bottom: 12px;
        }
        .item-header {
            display: flex;
            font-weight: bold;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            padding: 0 5px;
        }
        .item-row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            gap: 8px;
        }
        .col-name {
            flex: 2;
            display: flex;
            flex-direction: column;
        }
        .col-qty {
            width: 60px;
        }
        .col-price {
            flex: 2;
        }
        .col-subtotal {
            flex: 2;
            text-align: right;
            font-size: 13px;
            font-weight: bold;
            color: #28a745;
        }
        .item-name {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .item-memo {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }
        input {
            padding: 8px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            width: 100%;
        }
        input.qty-input {
            text-align: center;
        }
        input.price-input {
            text-align: right;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover {
            background-color: #218838;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            font-size: 15px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .result-total {
            border-top: 2px solid #007bff;
            padding-top: 8px;
            margin-top: 8px;
            font-weight: bold;
            font-size: 17px;
            color: #d9534f;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>품목 계산기</h2>

    <!-- 1번째 카테고리 -->
    <div class="section-title">⚔️ 1번째 카테고리 (무기)</div>
    <div class="item-header">
        <span style="flex:2;">물품 이름</span>
        <span style="width:60px; text-align:center;">수량</span>
        <span style="flex:2; text-align:right;">단가 (XXX)</span>
        <span style="flex:2; text-align:right;">소계</span>
    </div>
    
    <div class="item-row" data-category="1">
        <div class="col-name"><span class="item-name">ㅍ</span></div>
        <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
        <div class="col-price"><input type="text" class="price-input" value="(100) (000) (000)" oninput="formatInput(this); calculateAll();"></div>
        <div class="col-subtotal subtotal">(0)</div>
    </div>

    <div class="item-row" data-category="1">
        <div class="col-name"><span class="item-name">ㅋ</span></div>
        <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
        <div class="col-price"><input type="text" class="price-input" value="(250) (000) (000)" oninput="formatInput(this); calculateAll();"></div>
        <div class="col-subtotal subtotal">(0)</div>
    </div>

    <div class="item-row" data-category="1">
        <div class="col-name"><span class="item-name">ㅇ (200M)</span></div>
        <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
        <div class="col-price"><input type="text" class="price-input" value="(200) (000) (000)" oninput="formatInput(this); calculateAll();"></div>
        <div class="col-subtotal subtotal">(0)</div>
    </div>

    <div class="item-row" data-category="1">
        <div class="col-name"><span class="item-name">ㅇ (150M)</span></div>
        <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
        <div class="col-price"><input type="text" class="price-input" value="(150) (000) (000)" oninput="formatInput(this); calculateAll();"></div>
        <div class="col-subtotal subtotal">(0)</div>
    </div>

    <div class="item-row" data-category="1">
        <div class="col-name"><span class="item-name">ㅅ</span></div>
        <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
        <div class="col-price"><input type="text" class="price-input" value="(150) (000) (000)" oninput="formatInput(this); calculateAll();"></div>
        <div class="col-subtotal subtotal">(0)</div>
    </div>

    <div class="item-row" data-category="1">
        <div class="col-name">
            <span class="item-name">옹</span>
            <span class="item-memo">📝 100발</span>
        </div>
        <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
        <div class="col-price"><input type="text" class="price-input" value="(010) (000) (000)" oninput="formatInput(this); calculateAll();"></div>
        <div class="col-subtotal subtotal">(0)</div>
    </div>


    <!-- 2번째 카테고리 -->
    <div class="section-title">💊 2번째 카테고리 (약/소모품)</div>
    <div class="item-header">
        <span style="flex:2;">물품 이름</span>
        <span style="width:60px; text-align:center;">수량</span>
        <span style="flex:2; text-align:right;">단가 (XXX)</span>
        <span style="flex:2; text-align:right;">소계</span>
    </div>

    <div class="item-row" data-category="2">
        <div class="col-name">
            <span class="item-name">입장권</span>
            <span class="item-memo">📝 하루 제한: 10개</span>
        </div>
        <!-- max=10 제한 적용 -->
        <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" max="10" oninput="limitMax(this, 10); calculateAll();"></div>
        <div class="col-price"><input type="text" class="price-input" value="(030) (000) (000)" oninput="formatInput(this); calculateAll();"></div>
        <div class="col-subtotal subtotal">(0)</div>
    </div>

    <div class="item-row" data-category="2">
        <div class="col-name">
            <span class="item-name">씨앗</span>
            <span class="item-memo">📝 1000개</span>
        </div>
        <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
        <div class="col-price"><input type="text" class="price-input" value="(100) (000) (000)" oninput="formatInput(this); calculateAll();"></div>
        <div class="col-subtotal subtotal">(0)</div>
    </div>

    <button onclick="calculateAll()">합계 새로고침</button>

    <!-- 결과 영역 -->
    <div class="result-box">
        <div class="result-item">
            <span>1번째 카테고리 합계:</span>
            <span id="cat1Total">(0)</span>
        </div>
        <div class="result-item">
            <span>2번째 카테고리 합계:</span>
            <span id="cat2Total">(0)</span>
        </div>
        <div class="result-item result-total">
            <span>전체 총합:</span>
            <span id="grandTotal">(0)</span>
        </div>
    </div>
</div>

<script>
    // 입장권 수량 10개 초과 입력 방지 함수
    function limitMax(input, max) {
        if (parseInt(input.value) > max) {
            alert('입장권은 하루 최대 ' + max + '개까지만 선택 가능합니다.');
            input.value = max;
        }
    }

    // 입력할 때 3자리 단위 (XXX) (XXX) 형태로 포맷 변환
    function formatInput(input) {
        let rawValue = input.value.replace(/\D/g, '');
        if (rawValue === '') {
            input.value = '';
            return;
        }

        let formatted = '';
        for (let i = 0; i < rawValue.length; i += 3) {
            let chunk = rawValue.substring(i, i + 3);
            formatted += `(${chunk}) `;
        }

        input.value = formatted.trim();
    }

    // 숫자를 (XXX) (XXX) 포맷 문자열로 변환
    function formatNumber(num) {
        let str = num.toString();
        if (str === '0' || str === '') return '(0)';

        let formatted = '';
        for (let i = 0; i < str.length; i += 3) {
            let chunk = str.substring(i, i + 3);
            formatted += `(${chunk}) `;
        }
        return formatted.trim();
    }

    // 전체 계산 수행 및 품목별 소계 표시
    function calculateAll() {
        let cat1Total = 0;
        let cat2Total = 0;

        document.querySelectorAll('.item-row').forEach(row => {
            let cat = row.getAttribute('data-category');
            let qty = parseInt(row.querySelector('.qty-input').value) || 0;
            let price = parseInt(row.querySelector('.price-input').value.replace(/\D/g, '')) || 0;
            
            let itemSubtotal = qty * price;
            
            // 각 품목별 소계 표시
            row.querySelector('.subtotal').innerText = formatNumber(itemSubtotal);

            if (cat === '1') {
                cat1Total += itemSubtotal;
            } else if (cat === '2') {
                cat2Total += itemSubtotal;
            }
        });

        let grandTotal = cat1Total + cat2Total;

        document.getElementById('cat1Total').innerText = formatNumber(cat1Total);
        document.getElementById('cat2Total').innerText = formatNumber(cat2Total);
        document.getElementById('grandTotal').innerText = formatNumber(grandTotal);
    }

    // 페이지 로드 시 초기 계산 수행
    window.onload = function() {
        calculateAll();
    };
</script>

</body>
</html>
