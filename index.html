<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조직 계산기</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ff4757;
            --text-color: #ffffff;
            --text-sub: #a4b0be;
            --border-color: #2f3542;
            --input-bg: #2f3542;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 전체 계산기 너비를 3열이 충분히 들어가도록 넓게 설정 (1400px) */
        .calculator {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--accent-color);
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        /* 🔥 가로 3열 강제 정렬 핵심 코드 🔥 */
        .categories-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3칸으로 정확히 분할 */
            gap: 15px;
            align-items: start;
            width: 100%;
        }

        .category-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .section-title {
            font-size: 15px;
            font-weight: bold;
            color: #ffa502;
            border-bottom: 2px solid #ffa502;
            padding-bottom: 6px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .item-header {
            display: flex;
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 6px;
            padding: 0 2px;
            font-weight: 600;
        }

        .item-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 6px;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px;
            border-radius: 6px;
        }

        .col-name {
            flex: 1.8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .col-qty {
            width: 45px;
        }

        .col-price {
            flex: 2;
        }

        .col-subtotal {
            flex: 1.8;
            text-align: right;
            font-size: 12px;
            font-weight: bold;
            color: #2ed573;
            white-space: nowrap;
        }

        .item-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-memo {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        input {
            padding: 6px 4px;
            font-size: 12px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            width: 100%;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        input.qty-input {
            text-align: center;
        }

        input.price-input {
            text-align: right;
        }

        button {
            width: 100%;
            max-width: 400px;
            display: block;
            margin: 25px auto 0 auto;
            padding: 14px;
            font-size: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #ff6b81;
        }

        .result-box {
            margin-top: 20px;
            padding: 16px;
            background: #2f3542;
            border-radius: 12px;
            font-size: 14px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: var(--text-sub);
        }

        .result-item span:last-child {
            color: var(--text-color);
            font-weight: 600;
        }

        .result-total {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 17px;
            color: var(--accent-color) !important;
        }

        .result-total span:last-child {
            color: var(--accent-color) !important;
        }

        /* 스마트폰/모바일 화면에서만 세로로 자동 전환 */
        @media (max-width: 768px) {
            .categories-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>⚔️ 조직 관리 계산기</h2>

    <div class="categories-container">
        <!-- 1번째 카테고리 카드 -->
        <div class="category-card">
            <div class="section-title">🔫 무기</div>
            <div class="item-header">
                <span style="flex:1.8;">품목명</span>
                <span style="width:45px; text-align:center;">수량</span>
                <span style="flex:2; text-align:right;">단가</span>
                <span style="flex:1.8; text-align:right;">소계</span>
            </div>
            
            <div class="item-row" data-category="1">
                <div class="col-name"><span class="item-name">피스톨</span></div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="100,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>

            <div class="item-row" data-category="1">
                <div class="col-name"><span class="item-name">카빈소총</span></div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="250,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>

            <div class="item-row" data-category="1">
                <div class="col-name"><span class="item-name">어썰트라이플</span></div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="200,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>

            <div class="item-row" data-category="1">
                <div class="col-name"><span class="item-name">마이크로SMG/span></div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="150,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>

            <div class="item-row" data-category="1">
                <div class="col-name"><span class="item-name">펌프샷건</span></div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="150,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>

            <div class="item-row" data-category="1">
                <div class="col-name">
                    <span class="item-name">총알</span>
                    <span class="item-memo">📝 100발</span>
                </div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="10,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>
        </div>

        <!-- 2번째 카테고리 카드 -->
        <div class="category-card">
            <div class="section-title">💊 마약</div>
            <div class="item-header">
                <span style="flex:1.8;">품목명</span>
                <span style="width:45px; text-align:center;">수량</span>
                <span style="flex:2; text-align:right;">단가</span>
                <span style="flex:1.8; text-align:right;">소계</span>
            </div>

            <div class="item-row" data-category="2">
                <div class="col-name">
                    <span class="item-name">마약공장 입장권</span>
                    <span class="item-memo">📝 하루 제한: 10개</span>
                </div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" max="10" oninput="limitMax(this, 10); calculateAll();"></div>
                <div class="col-price"><input type="text" class="price-input" value="30,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>

            <div class="item-row" data-category="2">
                <div class="col-name">
                    <span class="item-name">대마초 씨앗</span>
                    <span class="item-memo">📝 1000개</span>
                </div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="100,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>
        </div>

        <!-- 3번째 카테고리-->
        <div class="category-card">
            <div class="section-title">⚔️ 근접무</div>
            <div class="item-header">
                <span style="flex:1.8;">품목명</span>
                <span style="width:45px; text-align:center;">수량</span>
                <span style="flex:2; text-align:right;">단가</span>
                <span style="flex:1.8; text-align:right;">소계</span>
            </div>

             <div class="item-row" data-category="2">
                <div class="col-name">
                    <span class="item-name">스위치 블레이드</span>
                </div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="50,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>
            
             <div class="item-row" data-category="3">
                <div class="col-name">
                    <span class="item-name">플래쉬</span>
                </div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="50,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>

            <div class="item-row" data-category="3">
                <div class="col-name">
                    <span class="item-name">C4</span>
                </div>
                <div class="col-qty"><input type="number" class="qty-input" value="1" min="0" oninput="calculateAll()"></div>
                <div class="col-price"><input type="text" class="price-input" value="20,000,000" oninput="formatInput(this); calculateAll();"></div>
                <div class="col-subtotal subtotal">0</div>
            </div>
        </div>
    </div>

    <button onclick="calculateAll()">합계 계산하기</button>

    <!-- 결과 영역 -->
    <div class="result-box">
        <div class="result-item">
            <span>무기 합계:</span>
            <span id="cat1Total">0</span>
        </div>
        <div class="result-item">
            <span>마약 합계:</span>
            <span id="cat2Total">0</span>
        </div>
        <div class="result-item">
            <span>근접무기 합계:</span>
            <span id="cat3Total">0</span>
        </div>
        <div class="result-item result-total">
            <span>전체 총합:</span>
            <span id="grandTotal">0</span>
        </div>
    </div>
</div>

<script>
    function limitMax(input, max) {
        if (parseInt(input.value) > max) {
            alert('하루 최대 ' + max + '개까지만 선택 가능합니다.');
            input.value = max;
        }
    }

    function formatInput(input) {
        let rawValue = input.value.replace(/\D/g, '');
        if (rawValue === '') {
            input.value = '';
            return;
        }
        input.value = Number(rawValue).toLocaleString('ko-KR');
    }

    function formatNumber(num) {
        if (isNaN(num) || num === 0) return '0';
        return num.toLocaleString('ko-KR');
    }

    function calculateAll() {
        let cat1Total = 0;
        let cat2Total = 0;
        let cat3Total = 0;

        document.querySelectorAll('.item-row').forEach(row => {
            let cat = row.getAttribute('data-category');
            let qty = parseInt(row.querySelector('.qty-input').value) || 0;
            let price = parseInt(row.querySelector('.price-input').value.replace(/\D/g, '')) || 0;
            
            let itemSubtotal = qty * price;
            row.querySelector('.subtotal').innerText = formatNumber(itemSubtotal);

            if (cat === '1') {
                cat1Total += itemSubtotal;
            } else if (cat === '2') {
                cat2Total += itemSubtotal;
            } else if (cat === '3') {
                cat3Total += itemSubtotal;
            }
        });

        let grandTotal = cat1Total + cat2Total + cat3Total;

        document.getElementById('cat1Total').innerText = formatNumber(cat1Total);
        document.getElementById('cat2Total').innerText = formatNumber(cat2Total);
        if (document.getElementById('cat3Total')) {
            document.getElementById('cat3Total').innerText = formatNumber(cat3Total);
        }
        document.getElementById('grandTotal').innerText = formatNumber(grandTotal);
    }

    window.onload = function() {
        calculateAll();
    };
</script>

</body>
</html>
