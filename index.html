<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조직 계산기</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #6366f1;
            --btn-add-color: #3b82f6;
            --btn-del-color: #ef4444;
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .calculator-layout {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
            align-items: start;
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h2 {
            margin: 0;
            color: var(--text-color);
            font-size: 24px;
        }

        /* 카테고리 카드 스타일 */
        .categories-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }

        .category-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #f59e0b;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
        }

        .item-price-text {
            font-size: 12px;
            color: var(--text-sub);
        }

        /* + 추가 버튼 */
        .btn-add-item {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-add-item:hover {
            background-color: var(--btn-add-color);
            border-color: var(--btn-add-color);
        }

        /* 오른쪽 선택된 항목 영수증 패널 */
        .side-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 20px;
        }

        .side-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-color);
        }

        .selected-list {
            min-height: 150px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
            margin-top: 50px;
        }

        .selected-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .selected-item-info {
            display: flex;
            flex-direction: column;
        }

        .selected-item-name {
            font-size: 13px;
            font-weight: 600;
        }

        .selected-item-price {
            font-size: 12px;
            color: #10b981;
            font-weight: bold;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-qty {
            background: #334155;
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-qty:hover {
            background: #475569;
        }

        .qty-val {
            font-size: 13px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .btn-del-selected {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 14px;
            margin-left: 4px;
        }

        .btn-del-selected:hover {
            color: var(--btn-del-color);
        }

        .summary-box {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-sub);
        }

        .summary-row.total {
            font-size: 18px;
            font-weight: bold;
            color: #f59e0b;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
        }

        .summary-row.total span:last-child {
            color: #10b981;
        }

        @media (max-width: 900px) {
            .calculator-layout {
                grid-template-columns: 1fr;
            }
            .side-panel {
                position: static;
            }
        }
    </style>
</head>
<body>

<div class="calculator-layout">
    <!-- 왼쪽: 카테고리 및 품목 선택 영역 -->
    <div class="main-panel">
        <div class="header-area">
            <h2>⚔️ 조직 계산기</h2>
        </div>

        <div class="categories-container">
            <!-- 1번째 카테고리: 무기 -->
            <div class="category-card">
                <div class="section-title">🔫 무기</div>
                
                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">피스톨</span>
                        <span class="item-price-text">100,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('피스톨', 100000000)">+ 추가</button>
                </div>

                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">카빈소총</span>
                        <span class="item-price-text">250,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('카빈소총', 250000000)">+ 추가</button>
                </div>

                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">어썰트라이플</span>
                        <span class="item-price-text">200,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('어썰트라이플', 200000000)">+ 추가</button>
                </div>

                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">마이크로SMG</span>
                        <span class="item-price-text">150,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('마이크로SMG', 150000000)">+ 추가</button>
                </div>

                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">펌프샷건</span>
                        <span class="item-price-text">150,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('펌프샷건', 150000000)">+ 추가</button>
                </div>
                
                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">총알</span>
                        <span class="item-price-text">10,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('총알', 10000000)">+ 추가</button>
                </div>
            </div>

            <!-- 2번째 카테고리: 소모품 -->
            <div class="category-card">
                <div class="section-title">💊 마약</div>
                
                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">마약공장 입장권</span>
                        <span class="item-price-text">30,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('마약공장 입장권', 30000000)">+ 추가</button>
                </div>

                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">대마초 씨앗</span>
                        <span class="item-price-text">100,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('대마초 씨앗', 100000000)">+ 추가</button>
                </div>
            </div>

            <!-- 3번째 카테고리: 근접무기 -->
            <div class="category-card">
                <div class="section-title">🔪 근접무기</div>
                
                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">스위치 블레이드</span>
                        <span class="item-price-text">50,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('스위치 블레이드', 50000000)">+ 추가</button>
                </div>

                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">플래쉬</span>
                        <span class="item-price-text">50,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('플래쉬', 50000000)">+ 추가</button>
                </div>

                <div class="item-row">
                    <div class="item-info">
                        <span class="item-name">C4</span>
                        <span class="item-price-text">20,000,000원</span>
                    </div>
                    <button class="btn-add-item" onclick="addItemToReceipt('C4', 20000000)">+ 추가</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 오른쪽: 선택된 항목 목록 및 영수증 계산 영역 -->
    <div class="side-panel">
        <div class="side-title">
            <span>📋 선택된 항목 목록</span>
        </div>

        <div class="selected-list" id="selectedList">
            <div class="empty-msg" id="emptyMsg">선택된 항목이 없습니다.</div>
        </div>

        <div class="summary-box">
            <div class="summary-row">
                <span>총 선택 개수:</span>
                <span id="totalQty">0개</span>
            </div>
            <div class="summary-row total">
                <span>최종 총 금액:</span>
                <span id="grandTotal">0원</span>
            </div>
        </div>
    </div>
</div>

<script>
    let selectedItems = [];

    function formatNumber(num) {
        return num.toLocaleString('ko-KR');
    }

    function addItemToReceipt(name, price) {
        let existing = selectedItems.find(item => item.name === name);
        if (existing) {
            existing.qty += 1;
        } else {
            selectedItems.push({
                name: name,
                price: price,
                qty: 1
            });
        }
        renderReceipt();
    }

    function changeQty(index, delta) {
        selectedItems[index].qty += delta;
        if (selectedItems[index].qty <= 0) {
            selectedItems.splice(index, 1);
        }
        renderReceipt();
    }

    function deleteItem(index) {
        selectedItems.splice(index, 1);
        renderReceipt();
    }

    function renderReceipt() {
        let listContainer = document.getElementById('selectedList');
        
        if (selectedItems.length === 0) {
            listContainer.innerHTML = '<div class="empty-msg">선택된 항목이 없습니다.</div>';
            document.getElementById('totalQty').innerText = '0개';
            document.getElementById('grandTotal').innerText = '0원';
            return;
        }

        let html = '';
        let totalQty = 0;
        let grandTotal = 0;

        selectedItems.forEach((item, index) => {
            let itemSubtotal = item.price * item.qty;
            totalQty += item.qty;
            grandTotal += itemSubtotal;

            html += `
                <div class="selected-item-row">
                    <div class="selected-item-info">
                        <span class="selected-item-name">${item.name}</span>
                        <span class="selected-item-price">${formatNumber(itemSubtotal)}원</span>
                    </div>
                    <div class="qty-controls">
                        <button class="btn-qty" onclick="changeQty(${index}, -1)">-</button>
                        <span class="qty-val">${item.qty}</span>
                        <button class="btn-qty" onclick="changeQty(${index}, 1)">+</button>
                        <button class="btn-del-selected" onclick="deleteItem(${index})">✕</button>
                    </div>
                </div>
            `;
        });

        listContainer.innerHTML = html;
        document.getElementById('totalQty').innerText = totalQty + '개';
        document.getElementById('grandTotal').innerText = formatNumber(grandTotal) + '원';
    }
</script>

</body>
</html>
